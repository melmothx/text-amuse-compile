name: linux

on:
  push:
    branches: ['*']
    tags-ignore: ['*']
  pull_request:
  
jobs:
  builddeb:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/melmothx/amusewiki-ci:trixie
    steps:
      - uses: actions/checkout@v5
      - name: build package
        run: |
          debuild -i -us -uc --pre-clean --post-clean -b
      - name: check package content
        run: |
          cd ..; for i in *.deb; do dpkg --contents $i; done; true
  testlist:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.tests.outputs.files }}
    steps:
      - uses: actions/checkout@v5
      - id: tests
        run: |
          find t/ -type f -name '*.t' | \
          perl -MJSON::PP -nlE '
            push @files, $_
            }{
            print "files=" . encode_json(\@files)
          ' >> "$GITHUB_OUTPUT"
  test:
    needs: [ testlist, builddeb ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_file: ${{ fromJson(needs.testlist.outputs.tests) }}

    container:
      image: ghcr.io/melmothx/amusewiki-ci:trixie
    steps:
      - uses: actions/checkout@v5
      - name: set PATH
        run: |
          echo "PATH=/opt/amusewiki-texlive/current/bin/arch:$PATH" >> $GITHUB_ENV

      - name: prove ${{ matrix.test_file }}
        run: |
          TEST_WITH_LATEX=0 RELEASE_TESTING=1 prove -lv ${{ matrix.test_file }}

      - name: prove ${{ matrix.test_file }} (with latex)
        run: |
          TEST_WITH_LATEX=1 RELEASE_TESTING=1 prove -lv ${{ matrix.test_file }}
